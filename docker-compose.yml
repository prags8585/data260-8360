services:
  mysql:
    image: mysql:8.0
    container_name: s8360-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: hw4pass
      MYSQL_DATABASE: s8360_rel
    ports:
      - "3306:3306"
    volumes:
      - s8360_mysql_data:/var/lib/mysql

  mongo:
    image: mongo:7.0
    container_name: s8360-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - s8360_mongo_data:/data/db

volumes:
  s8360_mysql_data:
  s8360_mongo_data:
