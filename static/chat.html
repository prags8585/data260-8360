<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Memory chat - HW6</title>
<style>
  body { font-family: -apple-system, "Segoe UI", Arial, sans-serif; margin: 0; background: #f1f2f6; color: #1c1e26; }
  header { background: #1c1e2e; color: #fff; padding: 12px 20px; font-weight: 600; }
  header span { font-weight: 400; opacity: .75; margin-left: 12px; font-size: 13px; }
  main { display: flex; gap: 16px; padding: 16px 20px; max-width: 1180px; margin: 0 auto; }
  #chat { flex: 2; background: #fff; border-radius: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.12); display: flex; flex-direction: column; height: 640px; }
  #log { flex: 1; overflow-y: auto; padding: 14px; }
  .msg { margin: 8px 0; padding: 9px 12px; border-radius: 10px; max-width: 82%; line-height: 1.4; font-size: 14px; white-space: pre-wrap; }
  .user { background: #4f46e5; color: #fff; margin-left: auto; }
  .assistant { background: #eef0f6; }
  form { display: flex; gap: 8px; padding: 10px; border-top: 1px solid #e5e7eb; }
  input[type=text] { flex: 1; padding: 10px; border: 1.5px solid #d1d5db; border-radius: 8px; font-size: 14px; }
  button { background: #4f46e5; color: #fff; border: 0; border-radius: 8px; padding: 0 18px; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .5; }
  aside { flex: 1; background: #fff; border-radius: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.12); padding: 14px; font-size: 13px; height: 612px; overflow-y: auto; }
  aside h3 { margin: 12px 0 4px; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: #6b7280; }
  aside ul { margin: 0; padding-left: 18px; } .muted { color: #9ca3af; } code { background: #f3f4f6; padding: 0 3px; border-radius: 3px; }
</style>
</head>
<body>
<header>Campus assistant with memory <span id="ids"></span></header>
<main>
  <section id="chat">
    <div id="log"></div>
    <form id="form"><input type="text" id="text" placeholder="Type a message..." autocomplete="off" required><button id="send">Send</button></form>
  </section>
  <aside id="memory"><h3>Memory used this turn</h3><div class="muted">Send a message to see what memory was used.</div></aside>
</main>
<script>
  const params = new URLSearchParams(location.search);
  const userId = params.get("user_id") || "demo_user";
  const sessionId = params.get("session_id") || "demo-session";
  document.getElementById("ids").textContent = `user_id=${userId}  session_id=${sessionId}`;
  const log = document.getElementById("log");
  function add(role, text) { const d = document.createElement("div"); d.className = "msg " + role; d.textContent = text; log.appendChild(d); log.scrollTop = log.scrollHeight; }
  function esc(s) { return String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
  document.getElementById("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const input = document.getElementById("text"), btn = document.getElementById("send");
    const message = input.value.trim(); if (!message) return;
    add("user", message); input.value = ""; btn.disabled = true;
    try {
      const res = await fetch("/api/chat", { method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ user_id: userId, session_id: sessionId, message }) });
      const data = await res.json();
      if (!res.ok) { add("assistant", "Error: " + JSON.stringify(data.detail)); return; }
      add("assistant", data.reply);
      const u = data.used;
      document.getElementById("memory").innerHTML =
        `<h3>Short-term window</h3><div><code>${u.short_term_count}</code> messages sent</div>` +
        `<h3>Session summary</h3><div>${u.session_summary ? esc(u.session_summary).replace(/\n/g, "<br>") : '<span class="muted">none yet</span>'}</div>` +
        `<h3>Lifetime summary</h3><div>${u.long_term_summary ? esc(u.long_term_summary).replace(/\n/g, "<br>") : '<span class="muted">none yet</span>'}</div>` +
        `<h3>Episodic facts retrieved</h3>` + (u.episodic_facts.length ? "<ul>" + u.episodic_facts.map(f => `<li>${esc(f.fact)} <span class="muted">(sim ${f.score})</span></li>`).join("") + "</ul>" : '<span class="muted">none</span>') +
        `<h3>Tokens</h3><div>prompt <code>${data.usage.prompt_tokens}</code> &middot; completion <code>${data.usage.completion_tokens}</code> &middot; ${Math.round(data.usage.latency_ms)} ms</div>`;
    } catch (err) { add("assistant", "Network error: " + err); }
    finally { btn.disabled = false; input.focus(); }
  });
</script>
</body>
</html>
