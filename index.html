<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HW1-Karthik Pragada</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Course Catalogue &amp; Enrolment</h1>

  <form id="courseForm">
    <div class="field">
      <label for="courseTitle">Course Title</label>
      <input
        type="text"
        id="courseTitle"
        name="courseTitle"
        placeholder="e.g. Introduction to Distributed Systems"
        required
        autofocus
      >
    </div>

    <div class="field">
      <label for="courseCode">Course Code</label>
      <input
        type="text"
        id="courseCode"
        name="courseCode"
        placeholder="e.g. DATA-260"
        required
      >
    </div>

    <div class="field">
      <label for="email">Your Email</label>
      <input
        type="email"
        id="email"
        name="email"
        placeholder="e.g. student@sjsu.edu"
        required
      >
    </div>

    <div class="field">
      <label for="description">Course Description</label>
      <textarea
        id="description"
        name="description"
        placeholder="Describe the course content, topics covered, and prerequisites..."
        required
      ></textarea>
    </div>

    <div class="field">
      <label for="department">Department</label>
      <select id="department" name="department" required>
        <option value="" disabled selected>Select a department</option>
        <option value="Computer Science">Computer Science</option>
        <option value="Data Science">Data Science</option>
        <option value="Business">Business</option>
        <option value="Engineering">Engineering</option>
      </select>
    </div>

    <div class="field checkbox-field">
      <input type="checkbox" id="agreeTerms" name="agreeTerms">
      <label for="agreeTerms">I agree to the terms and conditions.</label>
    </div>

    <button type="submit">Add Course to Catalogue</button>
  </form>

  <section id="resultSection" class="result-section" hidden>
    <h2>Submitted Course</h2>
    <table id="resultTable">
      <tbody></tbody>
    </table>
  </section>

  <script src="script.js"></script>
</body>
</html>
