  - {id: un05, category: unrelated, query: "Recommend a good pizza place in San Jose.", expected_hit: false, correct_answer: "Not a course-catalogue question; no cached course answer may be returned."}
  - {id: un06, category: unrelated, query: "Translate good morning into Spanish.", expected_hit: false, correct_answer: "Not a course-catalogue question; no cached course answer may be returned."}
  - {id: un07, category: unrelated, query: "How tall is Mount Everest?", expected_hit: false, correct_answer: "Not a course-catalogue question; no cached course answer may be returned."}
  - {id: un08, category: unrelated, query: "What will the weather be like tomorrow?", expected_hit: false, correct_answer: "Not a course-catalogue question; no cached course answer may be returned."}
  - {id: un09, category: unrelated, query: "Write a haiku about autumn.", expected_hit: false, correct_answer: "Not a course-catalogue question; no cached course answer may be returned."}
