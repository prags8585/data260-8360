<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Campus Course Catalogue</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand navbar-dark bg-dark mb-4">
    <div class="container-fluid">
      <a class="navbar-brand" href="/">Campus Course Catalogue</a>
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="/logout">Log out ({{ user }})</a></li>
      </ul>
    </div>
  </nav>

  <div class="container" style="max-width: 560px;">
    <div class="card shadow-sm">
      <div class="card-body">
        <h1 class="card-title h4">Welcome, {{ user }}!</h1>
        <p class="card-text text-muted">
          You're logged in to the Campus Course Catalogue admin dashboard.
          This is a protected route &mdash; only reachable with a valid, non-idle session.
        </p>
        <a href="/" class="btn btn-outline-primary">Manage Courses</a>
        <a href="/logout" class="btn btn-outline-danger">Log Out</a>
      </div>
    </div>
  </div>
</body>
</html>
